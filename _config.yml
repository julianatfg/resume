resume_header_intro: "<p>Especialista em Gestão Pública Municipal pela Universidade Federal Fluminense e bacharel em Turismo pela Universidade Veiga de Almeida. Tenho experiência de mais de 5 anos como servidora pública: em 2016 comecei a trabalhar na Ouvidoria da Secretaria Municipal de Transportes da Prefeitura do Rio de Janeiro, com atendimento direto ao público, e em 2017 assumi a função de Assistente. No final de 2018, fui convidada para um outro cargo de Assistente na Coordenadoria de Acesso à Informação, na Secretaria Municipal da Casa Civil. Lá tive a chance de conhecer todos os Ouvidores da Prefeitura e de ter contato com uma gama maior de gestores e de, consequentemente, começar a ter uma visão estratégica da administração pública municipal. Participei de alguns projetos, como a reestruturação do Portal da Transparência, do GT sobre a padronização dos sites da Prefeitura e, mais recentemente, da implantação da Agenda Pública de Compromissos e do Time Brasil da Controladoria-Geral da União. Em 2021, retornei à SMTR e estou atualmente lotada na Gerência de Regulamentação e Cadastro, da Coordenadoria de Regulamentação e Infrações Viárias.</p>"

