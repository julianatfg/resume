# Cursos extracurriculares
- award: Masterclass Liderança Carioca (2h)
  organization: Fundação João Goulart
  year: Maio/2022
  summary: "Parte do processo seletivo do Programa Líderes Cariocas. Conteúdo: apresentação do Programa Líderes Cariocas: sua evolução histórica, a gestão de competências e talentos, seus objetivos, benefícios racionais e experienciais e emocionais."

- award: Masterclass Integridade (2h)
  organization: Fundação João Goulart
  year: Maio/2022
  summary: "Parte do processo seletivo do Programa Líderes Cariocas. Conteúdo: disseminação da cultura de planejamento e integridade da Prefeitura, na busca da eficiência da gestão, sustentabilidade e resiliência da Cidade, reforçando nos servidores participantes a competência do compromisso público e da Política de Desenvolvimento do Gestor Carioca."

- award: Masterclass Rio Futuro (2h)
  organization: Fundação João Goulart
  year: Maio/2022
  summary: "Parte do processo seletivo do Programa Líderes Cariocas. Conteúdo: apresentação de cases de sucesso de planejamento na cidade do Rio Planejamento Estratégico Rio Futuro (PE) e o Plano de Desenvolvimento Sustentável e Ação Climática (PDS), bem como os Líderes que atuam em pautas relevantes para a gestão pública municipal."

